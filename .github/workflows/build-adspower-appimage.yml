name: Build AdsPower AppImage release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and release even when AdsPower version has not changed
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'adspower/**'
      - '.github/workflows/build-adspower-appimage.yml'
  schedule:
    # 02:00 Asia/Shanghai (UTC+8) = 18:00 UTC on the previous day.
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev curl python3 file

      - name: Check whether a new AdsPower version is available
        id: check
        working-directory: adspower
        env:
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          set -euo pipefail
          chmod +x download-latest.sh
          ./download-latest.sh
          REMOTE_VERSION="$(python3 -c "import json; print(json.load(open('deb_info.json'))['version'])")"
          RELEASES_JSON="$(curl --fail --location --silent --show-error \
            'https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100')"
          RELEASE_VERSION="$(printf '%s' "${RELEASES_JSON}" | python3 -c '
          import json,re,sys
          versions=[]
          for release in json.load(sys.stdin):
              for asset in release.get("assets", []):
                  m=re.fullmatch(r"adspower-([0-9]+(?:\\.[0-9]+)*)-[0-9a-f]+\\.AppImage", asset.get("name", ""))
                  if m: versions.append(tuple(int(x) for x in m.group(1).split(".")))
          print(".".join(map(str,max(versions))) if versions else "")
          ')"
          SHOULD_BUILD=false
          if [ "${FORCE_BUILD}" = true ] || [ -z "${RELEASE_VERSION}" ]; then
            SHOULD_BUILD=true
          elif [ "$(printf '%s\n' "${RELEASE_VERSION}" "${REMOTE_VERSION}" | sort -V | tail -1)" != "${RELEASE_VERSION}" ]; then
            SHOULD_BUILD=true
          fi
          echo "AdsPower upstream version: ${REMOTE_VERSION}"
          echo "Latest released AppImage version: ${RELEASE_VERSION:-none}"
          echo "Should build: ${SHOULD_BUILD}"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "version=${REMOTE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        id: build
        if: steps.check.outputs.should_build == 'true'
        working-directory: adspower
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x download-latest.sh build-appimage.sh
          ./build-appimage.sh
          VERSION="${{ steps.check.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_FILE="adspower-${VERSION}-${SHORT_SHA}.AppImage"
          BUILT="$(find . -maxdepth 1 -type f -name 'adspower-*.AppImage' -print -quit)"
          [ -n "${BUILT}" ]
          mv "${BUILT}" "${RELEASE_FILE}"
          chmod +x "${RELEASE_FILE}"
          file "${RELEASE_FILE}"
          sha256sum "${RELEASE_FILE}" > "${RELEASE_FILE}.sha256"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_file=${RELEASE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Smoke test AppImage metadata
        if: steps.check.outputs.should_build == 'true'
        working-directory: adspower
        env:
          APPIMAGE: ${{ steps.build.outputs.release_file }}
        run: |
          test -x "${APPIMAGE}"
          "./${APPIMAGE}" --appimage-version || true

      - name: Create GitHub release
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_FILE: ${{ steps.build.outputs.release_file }}
          SHORT_SHA: ${{ github.sha }}
        working-directory: adspower
        run: |
          TAG="adspower-v${VERSION}-${SHORT_SHA:0:7}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "AdsPower ${VERSION} (${SHORT_SHA:0:7})" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
            sleep 5
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "${TAG}" \
              "${RELEASE_FILE}" "${RELEASE_FILE}.sha256" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"; then
              exit 0
            fi
            echo "Release asset upload failed; retry ${attempt}/5"
            sleep 10
          done
          exit 1
